<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özel Proxy Arama Penceresi</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            padding: 15px 20px;
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .search-box {
            display: flex;
            width: 100%;
            max-width: 600px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 25px;
            overflow: hidden;
        }
        .search-box:focus-within {
            border-color: #58a6ff;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 20px;
            font-size: 15px;
            background: transparent;
            border: none;
            color: #f0f6fc;
            outline: none;
        }
        button {
            padding: 0 25px;
            background-color: #238636;
            color: white;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #2ea043;
        }
        .content-frame {
            flex: 1;
            width: 100%;
            border: none;
            background-color: #161b22;
        }
    </style>
</head>
<body>

    <div class="header">
        <form class="search-box" id="searchForm" onsubmit="performSearch(event)">
            <input type="text" id="searchInput" placeholder="Aramak istediğin şeyi yaz..." required autofocus>
            <button type="submit">Ara</button>
        </form>
    </div>

    <iframe id="proxyFrame" name="proxyFrame" class="content-frame" src="https://songsterr-proxy.sevilbulutsg.workers.dev"></iframe>

    <script>
        function performSearch(event) {
            event.preventDefault();
            const query = document.getElementById('searchInput').value;
            const iframe = document.getElementById('proxyFrame');
            
            // DuckDuckGo arama sorgusunu worker üzerinden iframe'e yüklüyoruz
            iframe.src = "https://songsterr-proxy.sevilbulutsg.workers.dev/?q=" + encodeURIComponent(query);
        }
    </script>

</body>
</html>
