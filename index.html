<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okul Bypass Portal</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0b0f19; color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .top-bar {
            padding: 12px 16px; background-color: #111827;
            border-bottom: 1px solid #1f2937; display: flex;
            justify-content: center; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }
        .search-wrapper {
            display: flex; width: 100%; max-width: 800px;
            background-color: #1f2937; border: 1px solid #374151;
            border-radius: 9999px; overflow: hidden;
        }
        .search-wrapper:focus-within { border-color: #3b82f6; }
        input[type="text"] {
            flex: 1; padding: 12px 20px; font-size: 16px;
            background: transparent; border: none; color: #ffffff; outline: none;
        }
        button {
            padding: 0 28px; background-color: #2563eb; color: white;
            border: none; font-size: 15px; font-weight: 600; cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #1d4ed8; }
        .frame-container {
            flex: 1; width: 100%; height: 100%; background: #ffffff;
        }
        iframe {
            width: 100%; height: 100%; border: none; background: #ffffff;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <form class="search-wrapper" onsubmit="executeBypass(event)">
            <input type="text" id="userInput" placeholder="Aramak istediğin kelimeyi veya siteyi yaz..." required autofocus>
            <button type="submit">Git</button>
        </form>
    </div>

    <div class="frame-container">
        <!-- Başlangıç olarak proxy worker adresimizi yüklüyoruz -->
        <iframe id="mainFrame" src="https://songsterr-proxy.sevilbulutsg.workers.dev/"></iframe>
    </div>

    <script>
        const WORKER_URL = "https://songsterr-proxy.sevilbulutsg.workers.dev/";

        function executeBypass(event) {
            event.preventDefault();
            const val = document.getElementById('userInput').value.trim();
            const frame = document.getElementById('mainFrame');

            if (val.includes('.') && !val.includes(' ')) {
                // Eğer web sitesi girildiyse
                let target = val;
                if (!target.startsWith('http')) target = 'https://' + target;
                frame.src = WORKER_URL + "?url=" + encodeURIComponent(target);
            } else {
                // Kelime aramasıysa
                frame.src = WORKER_URL + "?q=" + encodeURIComponent(val);
            }
        }
    </script>

</body>
</html>
